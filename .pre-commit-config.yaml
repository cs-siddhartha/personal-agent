default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check --force-exclude --
        language: unsupported
        types: [python]
        stages: [pre-commit]
      - id: ruff-format
        name: Ruff format check
        entry: uv run --locked ruff format --check --force-exclude --
        language: unsupported
        types: [python]
        stages: [pre-commit]
      - id: conventional-pre-commit
        name: Conventional Commit
        entry: uv run --locked conventional-pre-commit
        language: unsupported
        stages: [commit-msg]
